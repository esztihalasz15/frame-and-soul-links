
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#511d31">
  <title>Frame & Soul Photography</title>
  <meta name="description" content="Discover Frame & Soul Photography and my personal world.">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
      font-family: Georgia, "Times New Roman", serif;
      color: #f8eee8;
      background:
        radial-gradient(ellipse at top, #75334a 0%, transparent 55%),
        #35121f;
    }

    .page {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 24px;
      border: 1px solid #d9bd83;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #e5ca91;
      font-size: 36px;
    }

    h1 {
      margin: 0;
      color: #e5ca91;
      font-size: clamp(29px, 8vw, 39px);
      letter-spacing: 3px;
      font-weight: normal;
    }

    .subtitle {
      margin: 10px 0 12px;
      color: #e5ca91;
      letter-spacing: 5px;
      font-size: 12px;
    }

    .intro {
      margin: 22px 0 34px;
      color: #e7d5d5;
      font-size: 15px;
      font-style: italic;
    }

    .link {
      display: block;
      text-decoration: none;
      padding: 20px 16px;
      margin: 15px 0;
      border: 1px solid #d9bd83;
      border-radius: 8px;
      color: #f8eee8;
      background: rgba(255,255,255,0.035);
      transition: background .2s, transform .2s;
    }

    .link:first-of-type {
      color: #35121f;
      background: #d9bd83;
    }

    .link:hover {
      transform: translateY(-2px);
      background: #edd9aa;
      color: #35121f;
    }

    .link-title {
      display: block;
      font-size: 18px;
      margin-bottom: 7px;
    }

    .link-description {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 12px;
      opacity: .85;
    }

    footer {
      margin-top: 38px;
      color: #d9bd83;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo" aria-hidden="true">✳</div>

    <h1>FRAME &amp; SOUL</h1>
    <div class="subtitle">PHOTOGRAPHY</div>

    <p class="intro">Every frame tells a story.</p>

    <a class="link"
       href="https://www.instagram.com/eszterhalaszphotography/"
       target="_blank" rel="noopener noreferrer">
      <span class="link-title">Frame &amp; Soul Photography</span>
      <span class="link-description">Explore my photography</span>
    </a>

    <a class="link"
       href="https://www.instagram.com/esztyhalasz/"
       target="_blank" rel="noopener noreferrer">
      <span class="link-title">Halasz Eszter</span>
<span class="link-description">A little about me</span>
    </a>

    <footer>PHOTOGRAPHY · CREATIVITY · STORIES</footer>
  </main>
</body>
</html>
